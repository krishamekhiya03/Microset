<template>
    <div class="slds-grid slds-wrap">
        <div class="slds-col slds-large-size_3-of-12 slds-medium-size_3-of-12 slds-size_3-of-12">
            <template if:true={enableSuggestion}>
                <header class="slds-modal__header" style="height: 62.5px;">
                    <h2 class="slds-text-heading_medium">Last Selling Price</h2>
                </header>
            </template>
            <div class="suggestion-box-container">
                <table class="slds-table slds-table_bordered slds-table_cell-buffer suggestion-box">
                    <tbody>
                        <template for:each={suggestionPriceList} for:item="item">
                            <tr key={item.Id} class="table-custom" onclick={handleSuggestionSelect} data-id={item.Id}>
                                <td>
                                    <div class="slds-truncate">
                                        <span class="label-bold">🏢Account Name:</span> {item.Quotation_Name__r.Account_Name__r.Name}
                                    </div>
                                    <div class="slds-truncate">
                                        <span class="label-bold">📄Quote Number:</span> {item.Quotation_Name__r.Name}
                                    </div>
                                    <div class="slds-truncate">
                                        <span class="label-bold">📦Product Name:</span> {item.Product_Custom__r.Name}
                                    </div>
                                    <div class="slds-truncate">
                                        <span class="label-bold">💰Selling Price:</span>₹ {item.Sales_Price__c}
                                    </div>
                                    <div class="slds-truncate">
                                        <span class="label-bold">📅Last Selling Date:</span> <lightning-formatted-date-time value={item.LastModifiedDate} year="numeric" month="short" day="2-digit">
                                        </lightning-formatted-date-time>
                                    </div>
                                    <!-- <div class="slds-truncate">{item.Sales_Price__c}</div>
                                    <div class="slds-truncate">{item.Quotation_Name__r.Name}</div>
                                    <div class="slds-truncate">{item.Product_Custom__r.Name}</div> -->
                                </td>
                            </tr>
                        </template>

                        <template if:true={noSuggestions}>
                            <tr>
                                <td>
                                    <div class="slds-truncate">No results</div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
        <div class={modelClass}>
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Add Products</h2>
            </header>
            <div class="slds-p-around_small">
                <div class="slds-modal__content slds-modal_large slds-p-around_small slds-is-relative">
                    <template if:true={showProductSelection}>
                        <div class='inputVariable'>
                            <lightning-input type="text" placeholder='Search Products...' value={searchKey} onchange={handleSearchChange} class='slds-m-bottom_small'>
                            </lightning-input>
                        </div>

                        <!-- <lightning-datatable key-field="Id" data={visibleProducts} columns={columns} onrowselection={handleRowSelection} selected-rows={pageSelectedRowIds}>
                        </lightning-datatable> -->
                        <div class="table-wrapper">

                            <table class="slds-table slds-table_cell-buffer slds-table_bordered custom-table">

                                <thead>
                                    <tr>
                                        <th style="width:50px;"></th>
                                        <th style="width:140px;">HSN/SAC</th>
                                        <th style="width:130px;">Model Number</th>
                                        <th style="width:260px;">Product Name</th>
                                        <th style="width:55%">Description</th>
                                        <th style="width:130px;">Currency</th>
                                        <th style="width:120px;">Price</th>
                                        <th style="width:120px;">Discount(%)</th>
                                    </tr>
                                </thead>

                                <tbody>

                                    <template for:each={visibleProducts} for:item="row">

                                        <tr key={row.Id}>

                                            <td>
                                                <lightning-input type="checkbox" data-id={row.Id} checked={row.isSelected} onchange={handleRowSelection}>
                                                </lightning-input>
                                            </td>

                                            <td>{row.ProductCode}</td>
                                            <td>{row.ModelNumber}</td>
                                            <td class="product-name-cell">
                                                {row.ProductName}
                                            </td>

                                            <td class="description-cell">

                                                <div class="description-box">

                                                    <lightning-formatted-rich-text value={row.LineDescription__c}>
                                                    </lightning-formatted-rich-text>

                                                </div>

                                            </td>
                                            <td>
                                                <lightning-combobox variant="label-hidden" value={row.CurrencyIsoCode} options={currencyOptions} disabled="true" data-id={row.Id} onchange={handleCurrencyChange}>
                                                </lightning-combobox>
                                            </td>
                                            <td>
                                                {row.SalesPrice__c}
                                            </td>
                                            <td>
                                                {row.Discount__c}%
                                            </td>

                                        </tr>

                                    </template>

                                </tbody>

                            </table>

                        </div>
                        <div class="slds-m-top_small slds-align_absolute-center">
                            <lightning-button label="First" onclick={handleFirst} disabled={disablePrevious} icon-name="utility:jump_to_left"></lightning-button>
                            <lightning-button label="Previous" onclick={handlePrevious} disabled={disablePrevious} class="slds-m-left_small" icon-name="utility:chevronleft"></lightning-button>
                            <lightning-button label="Next" onclick={handleNext} disabled={disableNext} class="slds-m-left_small" icon-name="utility:chevronright" icon-position="right"></lightning-button>
                            <lightning-button label="Last" onclick={handleLast} disabled={disableNext} class="slds-m-left_small" icon-name="utility:jump_to_right" icon-position="right"></lightning-button>
                            <span class="slds-m-left_medium">Page {currentPage} of {totalPages}</span>
                        </div>
                    </template>
                    <template if:false={showProductSelection}>
                        <section>
                            <div class='header'>
                                <h1 class="slds-text-heading_medium slds-p-bottom_small">Review Selected Products</h1>
                            </div>
                            <div class="slds-p-around_small" style="max-height: 50vh; overflow-y: auto;">
                                <!-- <lightning-datatable key-field="Id" data={selectedProducts} columns={oppoLineCol} oncellchange={handleCellChange} hide-checkbox-column suppress-bottom-bar>
                                </lightning-datatable> -->
                                <div class="table-wrapper review-table-wrapper">

                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered review-table">

                                        <thead>
                                            <tr>
                                                <th style="width:11%">HSN/SAC</th>
                                                <th style="width:10%">Model Number</th>
                                                <th style="width:15%">Product Name</th>
                                                <th style="width:42%">Description</th>
                                                <th style="width:8%">Quantity<br />(Nos)</th>
                                                <th style="width:10%">Currency</th> <!-- ★ NEW -->
                                                <th style="width:10%">Price</th>
                                                <th style="width:9%">Discount(%)</th>
                                                <th style="width:8%">GST(%)</th>
                                            </tr>
                                        </thead>

                                        <tbody>

                                            <template for:each={selectedProducts} for:item="row">

                                                <tr key={row.Id}>

                                                    <td>{row.ProductCode}</td>
                                                    <td class="small-input-cell">
                                                        <lightning-input type="text" variant="label-hidden" value={row.ModelNumber} data-id={row.Id} data-field="ModelNumber" onchange={handleFieldChange}>
                                                        </lightning-input>
                                                    </td>
                                                    <td class="product-name-cell">
                                                        {row.ProductName}
                                                    </td>

                                                    <!-- DESCRIPTION -->
                                                    <td class="review-description-cell">

                                                        <div class="review-description-box">

                                                            <lightning-input-rich-text class="compact-richtext" value={row.LineDescription__c} data-id={row.Id} onchange={handleDescriptionChange}>
                                                            </lightning-input-rich-text>

                                                        </div>

                                                    </td>

                                                    <!-- QUANTITY -->
                                                    <td class="small-input-cell">

                                                        <lightning-input type="number" variant="label-hidden" value={row.Quantity__c} data-id={row.Id} data-field="Quantity__c" onchange={handleFieldChange}>
                                                        </lightning-input>

                                                    </td>

                                                    <!-- PRICE -->
                                                    <!-- <td class="small-input-cell">

                                                        <lightning-input type="number" variant="label-hidden" value={row.SalesPrice__c} data-id={row.Id} data-field="SalesPrice__c" onchange={handleFieldChange}>
                                                        </lightning-input>

                                                    </td> -->
                                                    <!-- ★ NEW: CURRENCY -->
                                                    <td class="small-input-cell">
                                                        <lightning-combobox variant="label-hidden" value={row.CurrencyIsoCode} options={currencyOptions} disabled="true" data-id={row.Id} onchange={handleCurrencyChange}>
                                                        </lightning-combobox>
                                                    </td>

                                                    <!-- PRICE (fixed) -->
                                                    <td class="small-input-cell">
                                                        <lightning-input type="number" variant="label-hidden" value={row.SalesPrice__c} data-id={row.Id} data-field="SalesPrice__c" onchange={handleFieldChange}>
                                                        </lightning-input>
                                                    </td>

                                                    <!-- DISCOUNT -->
                                                    <td class="small-input-cell">

                                                        <lightning-input type="number" variant="label-hidden" value={row.Discount__c} data-id={row.Id} data-field="Discount__c" onchange={handleFieldChange}>
                                                        </lightning-input>

                                                    </td>

                                                    <!-- GST -->
                                                    <td class="small-input-cell">

                                                        <lightning-input type="number" variant="label-hidden" value={row.GST__c} data-id={row.Id} data-field="GST__c" onchange={handleFieldChange}>
                                                        </lightning-input>

                                                    </td>

                                                </tr>

                                            </template>

                                        </tbody>

                                    </table>

                                </div>
                            </div>
                            <!-- <div class='content'>
                                <lightning-datatable key-field="Id" data={selectedProducts} columns={oppoLineCol} onsave={handleSaveDrafts} oncellchange={handleCellChange} draft-values={selectedProducts} hide-checkbox-column>
                                </lightning-datatable>
                            </div> -->
                            <!-- <div class="slds-m-top_medium slds-align_absolute-center">
                                        <lightning-button label="Back" onclick={handleBack}></lightning-button>
                                        <lightning-button variant="brand" label={saveButtonLabel} onclick={handleSaveItems} class="slds-m-left_small"></lightning-button>
                                    </div> -->
                        </section>
                    </template>
                </div>
            </div>
        </div>
    </div>
    <div class="slds-grid slds-wrap" if:true={enableFooter}>
        <div class="slds-col slds-large-size_12-of-12 slds-medium-size_12-of-12 slds-size_12-of-12">
            <footer class="slds-modal__footer" if:true={enableFooter}>
                <template if:true={isNextVisible}>
                    <lightning-button class="NextButton" variant="brand" label="Next" onclick={handleNextStep}>
                    </lightning-button>
                </template>
                <div class="slds-m-top_medium slds-align_absolute-center" if:false={showProductSelection}>
                    <lightning-button label="Back" onclick={handleBack}></lightning-button>
                    <lightning-button variant="brand" label={saveButtonLabel} onclick={handleSaveItems} class="slds-m-left_small"></lightning-button>
                </div>
                <!-- <lightning-button class="slds-m-around_xx-small" label="Save and Email Proforma" variant="brand" onclick={handleSendInvoice}></lightning-button>
                            <lightning-button class="slds-m-around_xx-small" label="Save to Proforma" variant="brand" onclick={handleSaveProforma}></lightning-button>
                            <lightning-button class="slds-m-around_xx-small" label="Cancel" onclick={closesendinvoideAction}>
                            </lightning-button> -->
            </footer>
        </div>
    </div>

</template>
